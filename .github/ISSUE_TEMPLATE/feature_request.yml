name: Feature request
description: Suggest an enhancement for this maintained fork
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case first. Features should fit the SPOA / SPOP scope of this library.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like the library to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, including application-level workarounds.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
    validations:
      required: false
