version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Accept() temporary-error retry is intentional; Temporary() is deprecated but
      # still the narrowest check available without changing Accept semantics.
      - path: agent/agent\.go
        text: "ne.Temporary"
        linters:
          - staticcheck
      - path: _test\.go
        linters:
          - errcheck
      # Style-only suggestions; keep diffs focused on correctness.
      - linters:
          - staticcheck
        text: "QF1006|S1021"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
