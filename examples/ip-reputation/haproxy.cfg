# Minimal sample — adjust addresses/paths for your environment.
# Validate with: haproxy -c -f examples/ip-reputation/haproxy.cfg

global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend www
    bind *:8080
    filter spoe engine ip-reputation config examples/ip-reputation/spoe-ip-reputation.conf
    tcp-request content reject if { var(sess.iprep.ip_score) -m int lt 20 }
    default_backend http-servers

backend http-servers
    server http 127.0.0.1:8081

backend iprep-servers
    mode tcp
    timeout connect 5s
    timeout server  3m
    server iprep1 127.0.0.1:3000
